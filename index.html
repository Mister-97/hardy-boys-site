<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARDY BOYS — Street Fashion</title>

  <!-- Cinzel for game-title drama, Special Elite for vintage stamps, Manrope for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Special+Elite&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: crosshair;
      font-family: 'Manrope', sans-serif;
    }

    ::selection { background: #C8A96E; color: #000; }

    /* ── fullscreen video bg ── */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: saturate(.55) contrast(1.1) brightness(.7);
    }

    /* ── layered overlays ── */

    /* deep vignette */
    .overlay-vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 100%);
    }

    /* left panel gradient — makes text readable */
    .overlay-left {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(
        to right,
        rgba(0,0,0,.92) 0%,
        rgba(0,0,0,.75) 30%,
        rgba(0,0,0,.2)  60%,
        transparent     100%
      );
    }

    /* bottom gradient */
    .overlay-bottom {
      position: fixed; bottom: 0; left: 0; right: 0; height: 35%; z-index: 1; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 100%);
    }

    /* film grain */
    .overlay-grain {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* scanlines */
    .overlay-scan {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      opacity: .04;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,1) 2px,
        rgba(0,0,0,1) 4px
      );
    }

    /* ── main UI ── */
    #ui {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1.5rem, 4vw, 3.5rem);
      justify-content: center;
    }

    /* ── top section: logo + title ── */
    .title-block { max-width: 480px; }

    /* oval emblem */
    .emblem {
      display: flex; align-items: center; gap: .6rem;
      margin-bottom: .6rem;
      opacity: 0;
      animation: fadeUp .8s ease .2s forwards;
    }
    .emblem-line {
      height: 1px; width: 2.5rem;
      background: linear-gradient(to right, rgba(200,169,110,.6), transparent);
    }
    .emblem-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: .62rem; letter-spacing: .3em; text-transform: uppercase;
      color: rgba(200,169,110,.7);
    }

    /* game-style title */
    .game-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(3.5rem, 8vw, 7.5rem);
      line-height: .88;
      letter-spacing: -.03em;
      text-transform: uppercase;
      color: #F0EAD8;
      text-shadow:
        0 0 40px rgba(200,169,110,.2),
        0 2px 6px rgba(0,0,0,1),
        0 4px 30px rgba(0,0,0,.9);
      opacity: 0;
      animation: fadeUp .9s ease .4s forwards;
    }

    .game-title .brand-of { display: block; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: .42em; letter-spacing: -.02em; text-transform: uppercase; color: rgba(240,232,216,.65); margin-bottom: .05em; }
    .game-title .brand-sub { display: block; font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: .17em; letter-spacing: .3em; text-transform: uppercase; color: rgba(200,169,110,.6); margin-top: .55em; }

    /* ornamental divider */
    .ornament {
      display: flex; align-items: center; gap: .6rem;
      margin: .75rem 0 .6rem;
      opacity: 0;
      animation: fadeUp .8s ease .6s forwards;
    }
    .ornament-line { flex: 1; max-width: 6rem; height: 1px; background: linear-gradient(to right, rgba(200,169,110,.5), transparent); }
    .ornament-diamond { width: 4px; height: 4px; background: rgba(200,169,110,.7); transform: rotate(45deg); }
    .ornament-text { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(200,169,110,.6); white-space: nowrap; }

    /* tagline */
    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(.78rem, 1.1vw, .95rem);
      color: rgba(240,234,216,.45);
      letter-spacing: .04em;
      opacity: 0;
      animation: fadeUp .8s ease .7s forwards;
    }

    /* ── center-left: game menu ── */
    .menu-block {
      display: flex; flex-direction: column; gap: 0;
      padding-top: 1.5rem;
    }

    /* push bottom strip to very bottom */
    .bottom-strip { margin-top: auto; }

    /* ── game menu hover: dim siblings, highlight selected ── */
    .menu-block:has(.menu-item:hover) .menu-item:not(:hover) .menu-item-text {
      color: rgba(240,234,216,.2);
    }

    .menu-item {
      display: flex; align-items: center; gap: .75rem;
      cursor: pointer;
      padding: .28rem 0;
      padding-left: 1rem;
      opacity: 0;
      animation: fadeUp .7s ease var(--delay) forwards;
      position: relative;
      width: fit-content;
      transition: padding-left .2s ease;
    }

    /* left border bar — slides in like a game cursor */
    .menu-item::before {
      content: '';
      position: absolute; left: 0; top: 10%; bottom: 10%;
      width: 2px;
      background: linear-gradient(to bottom, transparent, #C8A96E, transparent);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform .2s ease;
    }
    .menu-item:hover::before { transform: scaleY(1); }

    /* arrow glyph */
    .menu-item::after {
      content: '›';
      position: absolute; left: .3rem; top: 50%;
      transform: translateY(-50%) translateX(-4px);
      font-family: 'Cinzel', serif;
      font-size: .9em; color: #C8A96E;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
    }
    .menu-item:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }

    .menu-item-text {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(.8rem, 1.5vw, 1.1rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: rgba(240,234,216,.65);
      transition: color .2s ease, text-shadow .2s ease, letter-spacing .2s ease, transform .2s ease;
      display: inline-block;
    }
    .menu-item:hover .menu-item-text {
      color: #F5EDD8;
      letter-spacing: .14em;
      transform: translateX(4px);
      text-shadow:
        0 0 18px rgba(200,169,110,.6),
        0 0 40px rgba(200,169,110,.2);
    }

    .menu-item-tag {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: .48rem; letter-spacing: .18em;
      color: rgba(200,169,110,.55); text-transform: uppercase;
      border: 1px solid rgba(200,169,110,.25);
      padding: .12rem .35rem;
      opacity: 0; transform: translateX(-6px);
      transition: opacity .25s, transform .25s;
    }
    .menu-item:hover .menu-item-tag { opacity: 1; transform: translateX(0); }

    /* ── bottom strip ── */
    .bottom-strip {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: .5rem;
    }

    /* left: lore text */
    .lore-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(.58rem, .85vw, .72rem);
      color: rgba(240,234,216,.28);
      letter-spacing: .05em;
      font-style: italic;
      max-width: 300px; line-height: 1.6;
      opacity: 0; animation: fadeUp .8s ease 1.8s forwards;
    }

    /* right: version stamp */
    .version-block {
      text-align: right;
      opacity: 0; animation: fadeUp .8s ease 1.9s forwards;
    }
    .drop-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(.6rem, 1vw, .78rem);
      text-transform: uppercase;
      color: rgba(200,169,110,.65);
      letter-spacing: .15em;
      display: block; margin-bottom: .15rem;
    }
    .drop-sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: .52rem; letter-spacing: .18em;
      color: rgba(240,234,216,.22); text-transform: uppercase;
    }

    /* ── corner: oval logo stamp (top right) ── */
    .corner-emblem {
      position: fixed; top: clamp(1.5rem, 3vw, 3rem); right: clamp(1.5rem, 3vw, 3rem);
      z-index: 11; opacity: 0;
      animation: fadeIn 1.2s ease 1s forwards;
    }

    /* ── press any key prompt ── */
    .press-prompt {
      position: fixed; bottom: clamp(1.5rem, 3vw, 2.5rem); left: 50%; transform: translateX(-50%);
      z-index: 11;
      font-family: 'Special Elite', monospace;
      font-size: .65rem; letter-spacing: .3em; text-transform: uppercase;
      color: rgba(240,234,216,.35);
      animation: blink 2.2s ease-in-out infinite, fadeIn 1s ease 2s both;
    }

    /* ── loading bar (bottom) ── */
    .loading-bar-wrap {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 11;
      height: 2px; background: rgba(255,255,255,.04);
    }
    .loading-bar {
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(200,169,110,.7), rgba(200,169,110,.4));
      width: 0%;
      animation: load 3s ease 0s forwards;
    }

    /* ── keyframes ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: .35; } 50% { opacity: .1; }
    }
    @keyframes load {
      0%   { width: 0%; }
      60%  { width: 85%; }
      80%  { width: 92%; }
      100% { width: 100%; }
    }

    .menu-item:focus { outline: none; }
    .menu-item:focus .menu-item-text { color: #F0EAD8; }

    .footer-link {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: .58rem; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(240,234,216,.35); text-decoration: none;
      transition: color .2s;
    }
    .footer-link:hover { color: rgba(200,169,110,.8); }
  </style>
</head>
<body>

  <!-- BG VIDEO -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="/Users/a/Downloads/hardyboys_hero.mp4" type="video/mp4" />
  </video>

  <!-- OVERLAYS -->
  <div class="overlay-vignette"></div>
  <div class="overlay-left"></div>
  <div class="overlay-bottom"></div>
  <div class="overlay-grain"></div>
  <div class="overlay-scan"></div>

  <!-- CORNER LOGO (top right) -->
  <div class="corner-emblem">
    <img src="/Users/a/Downloads/hardy boys logo.png" alt="Hardy Boys" style="width:110px; height:auto; filter: drop-shadow(0 0 12px rgba(200,169,110,.25));" />
  </div>

  <!-- MAIN UI -->
  <div id="ui">

    <!-- TOP: title block -->
    <div class="title-block">

      <div class="emblem">
        <div class="emblem-line"></div>
        <span class="emblem-text">Saigon Street Culture</span>
        <div class="emblem-line" style="background:linear-gradient(to left,rgba(200,169,110,.6),transparent);"></div>
      </div>

      <h1 class="game-title">
        <span class="brand-of">Hardy</span>
        Boys
        <span class="brand-sub">Street Fashion</span>
      </h1>

      <div class="ornament">
        <div class="ornament-line"></div>
        <div class="ornament-diamond"></div>
        <span class="ornament-text">Raw Strength · Street Culture · No Compromise</span>
        <div class="ornament-diamond"></div>
        <div class="ornament-line" style="background:linear-gradient(to left,rgba(200,169,110,.5),transparent);"></div>
      </div>

      <p class="tagline">The street remembers what you wore.</p>
    </div>

    <!-- MIDDLE: game-style menu -->
    <nav class="menu-block" aria-label="Main navigation">

      <div class="menu-item" style="--delay:.9s;" tabindex="0" role="link">
        <span class="menu-item-text">New Drops</span>
        <span class="menu-item-tag">Live Now</span>
      </div>

      <div class="menu-item" style="--delay:1.0s;" tabindex="0" role="link">
        <span class="menu-item-text">See All</span>
      </div>

      <div class="menu-item" style="--delay:1.1s;" tabindex="0" role="link">
        <span class="menu-item-text">Store</span>
      </div>

      <div class="menu-item" style="--delay:1.2s;" tabindex="0" role="link">
        <span class="menu-item-text">Worldwide</span>
      </div>

      <div class="menu-item" style="--delay:1.3s;" tabindex="0" role="link">
        <span class="menu-item-text">About Us</span>
      </div>

      <div class="menu-item" style="--delay:1.4s;" tabindex="0" role="link">
        <span class="menu-item-text">Archive</span>
      </div>

      <div class="menu-item" style="--delay:1.55s;" tabindex="0" role="link">
        <span class="menu-item-text" style="font-size:.75em; color:rgba(240,234,216,.32);">Size Charts</span>
      </div>

      <div class="menu-item" style="--delay:1.6s;" tabindex="0" role="link">
        <span class="menu-item-text" style="font-size:.75em; color:rgba(240,234,216,.32);">Care Guide</span>
      </div>

    </nav>

    <!-- BOTTOM: lore + version -->
    <div class="bottom-strip">
      <div></div>
      <div class="version-block">
        <div style="display:flex; align-items:center; justify-content:flex-end; gap:1.2rem;">
          <a href="https://lnk.bio/hardyboys.vn" class="footer-link" target="_blank" rel="noopener">Bio</a>
          <span style="color:rgba(200,169,110,.25); font-size:.5rem;">✦</span>
          <a href="https://hardyboys.vn/support/" class="footer-link" target="_blank" rel="noopener">Support</a>
          <span style="color:rgba(200,169,110,.25); font-size:.5rem;">✦</span>
          <a href="https://www.instagram.com/hardyboys.vn" class="footer-link" target="_blank" rel="noopener">Instagram</a>
          <span style="color:rgba(200,169,110,.25); font-size:.5rem;">✦</span>
          <a href="https://www.tiktok.com/@hardyboys.vn" class="footer-link" target="_blank" rel="noopener">TikTok</a>
        </div>
      </div>
    </div>

  </div>

  <!-- PRESS ANY KEY -->
  <div class="press-prompt" aria-hidden="true">✦ Press any key to enter ✦</div>

  <!-- LOADING BAR -->
  <div class="loading-bar-wrap" aria-hidden="true">
    <div class="loading-bar"></div>
  </div>

  <script>
    // custom gold cursor
    const dot = document.createElement('div');
    dot.style.cssText = 'position:fixed;top:0;left:0;width:6px;height:6px;background:#C8A96E;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .18s,height .18s,opacity .18s,background .18s;will-change:left,top;';
    document.body.appendChild(dot);

    const ring = document.createElement('div');
    ring.style.cssText = 'position:fixed;top:0;left:0;width:28px;height:28px;border:1px solid rgba(200,169,110,.35);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:left .12s ease,top .12s ease,width .2s,height .2s,opacity .2s;will-change:left,top;';
    document.body.appendChild(ring);

    let mx = 0, my = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left  = mx + 'px'; dot.style.top  = my + 'px';
    });
    setInterval(() => { ring.style.left = mx + 'px'; ring.style.top = my + 'px'; }, 16);

    document.querySelectorAll('.menu-item').forEach(el => {
      el.addEventListener('mouseenter', () => {
        dot.style.width='10px'; dot.style.height='10px'; dot.style.background='#F0EAD8';
        ring.style.width='44px'; ring.style.height='44px'; ring.style.opacity='.6';
      });
      el.addEventListener('mouseleave', () => {
        dot.style.width='6px'; dot.style.height='6px'; dot.style.background='#C8A96E';
        ring.style.width='28px'; ring.style.height='28px'; ring.style.opacity='1';
      });
    });

    document.addEventListener('keydown', () => {
      document.querySelector('.press-prompt').style.opacity = '0';
    });
  </script>

</body>
</html>
